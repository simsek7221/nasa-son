name: NASA data smoke tests

on:
  push:
    branches: [nasa-data-upgrade]
  pull_request:
    branches: [main]

jobs:
  syntax-and-nasa-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Compile Streamlit app
        run: python -m py_compile app.py
      - name: Check NASA POWER parameter dictionary and 135+ pool
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          combinations = [("AG","DAILY"),("AG","HOURLY"),("RE","DAILY"),("RE","HOURLY"),("SB","DAILY"),("SB","HOURLY"),("HY","DAILY")]
          total = 0
          for community, temporal in combinations:
              query = urllib.parse.urlencode({"community":community,"temporal":temporal,"metadata":"true","user":"nasapower4r"})
              url = "https://power.larc.nasa.gov/api/system/manager/parameters?" + query
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      payload = json.load(response)
                  if isinstance(payload, dict) and isinstance(payload.get("parameters"), dict):
                      payload = payload["parameters"]
                  if isinstance(payload, dict) and isinstance(payload.get("parameter"), dict):
                      payload = payload["parameter"]
                  if isinstance(payload, dict):
                      count = sum(1 for key,value in payload.items()
                                  if isinstance(value,dict) and str(key).replace("_","").isalnum())
                      total += count
                      print(f"NASA POWER {community}/{temporal}: {count} catalogue records")
              except Exception as exc:
                  print(f"NASA POWER {community}/{temporal} unavailable: {exc}")
          print("NASA POWER community/resolution records:", total)
          combined_total = total + 51
          print("Minimum combined NASA catalogue (POWER + 51 GIBS layers):", combined_total)
          if combined_total < 135:
              raise SystemExit(f"NASA catalogue has fewer than 135 products: {combined_total}")
          source = Path("app.py").read_text(encoding="utf-8")
          if "def nasa_veri_havuzu(" not in source or "NASA uydu harita katmanı" not in source:
              raise SystemExit("Combined NASA POWER + NASA GIBS data pool is missing")
          if "🌐 3D Dünya" not in source or "three.min.js" not in source:
              raise SystemExit("Interactive 3D NASA globe is missing")
          print("PASS: NASA parameter metadata and NASA GIBS catalogue are integrated.")
          PY
      - name: Check NASA POWER daily API
        run: |
          python - <<'PY'
          import datetime, json, urllib.parse, urllib.request
          lat, lon = 37.8859, 41.1198
          day = (datetime.date.today() - datetime.timedelta(days=7)).strftime("%Y%m%d")
          common = {"latitude": lat, "longitude": lon, "start": day, "end": day, "format": "JSON", "time-standard": "LST", "community": "AG"}
          def get_power(parameters):
              q = dict(common, parameters=parameters)
              url = "https://power.larc.nasa.gov/api/temporal/daily/point?" + urllib.parse.urlencode(q)
              with urllib.request.urlopen(url, timeout=45) as r:
                  data = json.load(r)
              params = data.get("properties", {}).get("parameter", {})
              if not params:
                  raise RuntimeError("NASA POWER response has no parameter data")
              print("PASS NASA POWER:", sorted(params), "T2M:", params.get("T2M", {}).get(day, "not published"))
          get_power("T2M,T2M_MAX,T2M_MIN,RH2M,PRECTOTCORR,WS10M,WD10M,PS,ALLSKY_SFC_SW_DWN")
          get_power("GWETTOP,GWETROOT,GWETPROF")
          PY
      - name: Check NASA POWER hourly near-real-time API
        run: |
          python - <<'PY'
          import datetime, json, urllib.parse, urllib.request
          end = datetime.datetime.utcnow().date()
          start = end - datetime.timedelta(days=7)
          params = {
              "latitude": 37.8859, "longitude": 41.1198,
              "start": start.strftime("%Y%m%d"), "end": end.strftime("%Y%m%d"),
              "community": "RE", "parameters": "T2M,RH2M,PRECTOTCORR,WS10M,WD10M,PS",
              "format": "JSON", "time-standard": "UTC"
          }
          url = "https://power.larc.nasa.gov/api/temporal/hourly/point?" + urllib.parse.urlencode(params)
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.load(r)
          series = data.get("properties", {}).get("parameter", {})
          if not series.get("T2M"):
              raise SystemExit("NASA POWER hourly API returned no T2M observations")
          latest = max(k for k, v in series["T2M"].items() if v is not None and float(v) != -999)
          print("PASS NASA POWER hourly; latest UTC observation:", latest)
          print("Hourly parameters:", sorted(series))
          PY
      - name: Verify NASA-only science data and coordinate-only city geocoding
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("app.py").read_text(encoding="utf-8").lower()
          forbidden = ["api.openweathermap.org", "api.weatherapi.com", "windy.com", "nominatim.openstreetmap.org"]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit("Unapproved weather/map provider found: " + ", ".join(found))
          if "power.larc.nasa.gov" not in source or "gibs.earthdata.nasa.gov" not in source:
              raise SystemExit("NASA POWER and NASA GIBS sources must both be present")
          if "geocoding-api.open-meteo.com" not in source or "def sehir_ara(" not in source:
              raise SystemExit("Coordinate-only city geocoder is missing")
          geocoder = source.split("def sehir_ara(", 1)[1].split("# --- nasa power gercek veri katalogu ---", 1)[0]
          if '"latitude"' not in geocoder or '"longitude"' not in geocoder:
              raise SystemExit("City geocoder must return coordinates")
          if "power.larc.nasa.gov" in geocoder or "gibs.earthdata.nasa.gov" in geocoder:
              raise SystemExit("Geocoder must not fetch environmental measurements")
          print("PASS: NASA POWER + NASA GIBS provide science data; Open-Meteo is used only for city coordinates.")
          PY
      - name: Live-test Batman, Istanbul, and Ankara city geocoding
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          cities = ["Batman", "İstanbul", "Ankara"]
          for city in cities:
              query = urllib.parse.urlencode({"name": city, "count": 10, "language": "tr", "format": "json"})
              url = "https://geocoding-api.open-meteo.com/v1/search?" + query
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
              results = payload.get("results") or []
              if not results:
                  raise SystemExit(f"Geocoding returned no results for {city}")
              match = next((item for item in results if item.get("country_code") == "TR"), None)
              if match is None:
                  raise SystemExit(f"No Turkey result returned for {city}")
              name = match.get("name")
              country = match.get("country")
              admin = match.get("admin1") or match.get("admin2")
              lat, lon = float(match["latitude"]), float(match["longitude"])
              if not name or not country or not admin:
                  raise SystemExit(f"Missing name/country/admin region for {city}: {match}")
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  raise SystemExit(f"Invalid coordinates for {city}: {lat}, {lon}")
              print(f"PASS {city}: {name}, {admin}, {country} ({lat:.5f}, {lon:.5f})")
          PY
      - name: Check NASA GIBS catalogue and 51 map layers
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url = "https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0"
          with urllib.request.urlopen(url, timeout=60) as r:
              root = ET.fromstring(r.read())
          layers = {}
          excluded = ("no data", "mask", "graticule", "coastline", "border", "place label", "orbit")
          for node in root.iter():
              if node.tag.split("}")[-1] != "Layer":
                  continue
              name = title = None
              for child in list(node):
                  tag = child.tag.split("}")[-1]
                  if tag == "Name": name = child.text
                  elif tag == "Title": title = child.text
              if name and title and not any(x in (name + " " + title).casefold() for x in excluded):
                  layers[name] = title
          print("NASA GIBS usable layers:", len(layers))
          if len(layers) < 51:
              raise SystemExit("NASA GIBS returned fewer than 51 usable layers")
          PY
